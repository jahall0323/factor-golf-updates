name: Baseline regression gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_regressions.py
      - run: python -m unittest discover -s tests -v
      - name: Windows PowerShell 5.1 syntax
        shell: powershell
        run: ./tools/check_powershell.ps1
  club-detection:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Club detection feedback and verification contracts
        shell: powershell
        run: ./tests/test_club_detection.ps1
  install-update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolated install and update contracts
        shell: powershell
        run: ./tests/test_install_update.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-update-results
          path: install-update-results.json
